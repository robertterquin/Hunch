<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hunch — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hunch-v2.css">
<style>
.center { width: 420px; margin: 40px auto 0; }
.center .title { font-size: 34px; text-align: center; }
.center .lede { text-align: center; margin: 10px auto 0; font-size: 16px; }
.form { margin-top: 32px; padding: 32px; }
.form .label { display: block; margin: 18px 0 8px; color: var(--text-2); }
.form .label:first-child { margin-top: 0; }
.form .btn-primary { width: 100%; margin-top: 24px; }
.links { display: flex; justify-content: space-between; margin-top: 18px; font-size: 14px; }
.links a { color: var(--blue); }
</style></head><body>
{{bar:signin}}
<main class="page"><div class="center">
  <h1 class="title">Sign in</h1>
  <p class="lede">Save reports and compare them later.</p>
  <section class="sheet form">
    <label class="label">Email</label><div class="field focus">juan@school.edu.ph</div>
    <label class="label">Password</label><div class="field">••••••••••</div>
    <a class="btn btn-primary btn-lg">Sign in</a>
    <div class="links"><a>Forgot password?</a><a>Create account</a></div>
  </section>
</div></main></body></html>
